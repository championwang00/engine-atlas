<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧置气门 Flathead</title>
<style>html,body{margin:0;background:#d9d9d6}#fig{display:block;width:100%;max-width:720px;margin:0 auto;aspect-ratio:720/440;touch-action:none;cursor:grab}</style></head>
<body><svg id="fig" viewBox="0 0 720 440" role="img" aria-label="侧置气门 Flathead"></svg>
<script>
const SPEED=150,TOTAL=720;let OVERLAY_SHIFT=-70;

const IN=[350,530],EX=[140,370];
// piston + cylinder section (cut at x=0 plane toward viewer kept closed): bore half 40
function walls(x0,x1,y0,y1,z0,z1){const sx=Math.sin(az*D)>0?1:-1,sy=Math.cos(az*D)>0?1:-1;
 const xa=sx>0?[x1-10,x1]:[x0,x0+10];box(xa[0],xa[1],y0,y1,z0,z1,'cut',null,-1e5);
 const ya=sy>0?[y1-10,y1]:[y0,y0+10];box(sx>0?x0:x0+10,sx>0?x1-10:x1,ya[0],ya[1],z0,z1,'cut',null,-1e5);}
function cylinderSection(cx,ph,{top=0,bottom=-110,blockY=[-60,60],liner=true}={}){
 const pz=-14-34*(1-Math.cos(ph*D))/2*2; // piston crown z
 cyl([cx,0,pz-40],[cx,0,pz],38,'mid',22);
 cyl([cx,0,pz-1],[cx,0,pz],38.6,'lo',22,0.5);
 return pz;}

const FIGBOX=[[-70,-60,-200],[70,150,-200],[70,150,40],[-70,-60,40],[70,-60,40],[-70,150,-200]];
function SCENE(phi){const ph=phi;const pz=cylinderSection(0,ph,{blockY:[-60,48]});
 // valve chamber beside bore, head is flat slab over both
 walls(-56,56,-60,130,-150,22);box(-44,44,46,58,-150,-70,'cut');
 {const sx=Math.sin(az*D)>0?1:-1;box(sx>0?0:-46,sx>0?46:0,-50,120,6,22,'cut');}
 const camy=88,camz=-140;cyl([-60,camy,camz],[48,camy,camz],5,'mid',12);
 const lifts=[];
 [['int',-18,IN],['exh',18,EX]].forEach(([t,x,win])=>{const L=lift(ph,win[0],win[1]);lifts.push(L);
  const th=ph/2-(win[0]+win[1])/4;lobe(x,9,camy,camz,11,7,(win[1]-win[0])/2,-th,'hi',1);
  const lz=camz+11+7*L;cyl([x,camy,lz],[x,camy,lz+20],6,'lo',14);
  // valve upside down: head on top seats at z=-6, opens upward
  const vz=lz+20+4;cyl([x,camy,lz+20],[x,camy,-8+7*L],2,'hi',8);cyl([x,camy,-8+7*L],[x,camy,-5+7*L],12,t,20);
  spring([x,camy,lz+24],[x,camy,-50],7,'lo');});
 label([18,camy,-2],'侧置气门',30,-28);label([-18,camy,camz+14],'凸轮轴',-36,30);label([0,30,-4],'燃烧室→缸筒（气流折返）',-60,-40);
 return {readout:'侧置气门 · 凸轮 '+String(Math.round(ph/2)).padStart(3,'0')+'°  进气 '+lifts[0].toFixed(2)+'  排气 '+lifts[1].toFixed(2),
 overlay:chart([{f:p=>lift(p,IN[0],IN[1]),col:'#5a78ae'},{f:p=>lift(p,EX[0],EX[1]),col:'#b36a45'}],ph,520,330,184,72,'气门升程')};}


const W=720,H=440,D=Math.PI/180;
const mod=(a,n)=>((a%n)+n)%n;
function lift(ph,o,c){const s=c-o,x=mod(ph-o,720);return x>=s?0:Math.sin(x/s*Math.PI)**2;}
const TONE={hi:[244,244,240],mid:[205,205,200],lo:[160,160,155],dk:[112,112,108],int:[128,156,200],exh:[206,146,112],act:[214,92,80],ok:[120,170,130],cut:[226,222,212]};
let az=-52,el=28,AZ0=-52,EL0=28,phi=0,run=false,last=0,raf=0;
let faces=[],labels=[];
function cam(){const a=az*D,e=el*D,ca=Math.cos(a),sa=Math.sin(a),ce=Math.cos(e),se=Math.sin(e);
 return p=>{const x=p[0]*ca-p[1]*sa,y=p[0]*sa+p[1]*ca;return [x,-(y*se+p[2]*ce),-y*ce+p[2]*se];};}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const nrm=a=>{const l=Math.hypot(...a)||1;return mul(a,1/l);};
// solid = list of polygons (3D) ; oriented outward from centroid
function solid(polys,tone,bias=0){const all=polys.flat();const c=mul(all.reduce(add,[0,0,0]),1/all.length);
 for(const q of polys){const n=crs(sub(q[1],q[0]),sub(q[2],q[0]));const fc=mul(q.reduce(add,[0,0,0]),1/q.length);faces.push({q:dot(n,sub(fc,c))<0?q.slice().reverse():q,tone,bias,c});}}
function box(x0,x1,y0,y1,z0,z1,tone,T,bias){const v=[];for(const z of[z0,z1])for(const y of[y0,y1])for(const x of[x0,x1])v.push(T?T([x,y,z]):[x,y,z]);
 const f=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];solid(f.map(i=>i.map(k=>v[k])),tone,bias);}
// prism: 2D profile (u,v) extruded along axis from p0 by len; u,v,axis unit vectors
function prism(p0,ax,u,v,prof,len,tone,bias){const A=prof.map(([a,b])=>add(p0,add(mul(u,a),mul(v,b))));const B=A.map(p=>add(p,mul(ax,len)));
 const polys=[A,B];for(let i=0;i<A.length;i++){const j=(i+1)%A.length;polys.push([A[i],A[j],B[j],B[i]]);}solid(polys,tone,bias);}
function basis(ax){ax=nrm(ax);const t=Math.abs(ax[2])<.9?[0,0,1]:[1,0,0];const u=nrm(crs(ax,t));return [ax,u,crs(ax,u)];}
function cyl(p0,p1,r,tone,n=16,bias){const d=sub(p1,p0),L=Math.hypot(...d);const[ax,u,v]=basis(d);const pr=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI;pr.push([r*Math.cos(a),r*Math.sin(a)]);}prism(p0,ax,u,v,pr,L,tone,bias);}
// cam lobe on shaft along x: centre (x,y,z), rotation th (deg), nose direction at th=0 is +z (dir=1) or -z (dir=-1)
function lobe(x,w,y,z,r0,h,spanDeg,th,tone,nose=1){const pr=[];const half=spanDeg/2;for(let i=0;i<48;i++){const a=i/48*360-180;const r=r0+(Math.abs(a)<half?h*Math.cos(a/half*Math.PI/2)**2:0);const g=(a+th)*D;pr.push([r*Math.sin(g),nose*r*Math.cos(g)]);}
 prism([x-w/2,y,z],[1,0,0],[0,1,0],[0,0,1],pr,w,tone);}
function spring(p0,p1,r,tone){const d=sub(p1,p0),n=7;for(let i=0;i<n;i++){const a=add(p0,mul(d,i/n+.02)),b=add(p0,mul(d,(i+.62)/n));cyl(a,b,r,tone,14);}}
function label(p,t,dx=0,dy=-26){labels.push({p,t,dx,dy});}
function shade(tone,n){const b=TONE[tone]||TONE.mid;const k=.62+.38*Math.max(0,dot(n,nrm([-.45,.55,.7])));return 'rgb('+b.map(c=>Math.round(c*k)).join(',')+')';}
let SCALE=0,ORG=[W/2,H/2];
function project(pr){return p=>{const s=pr(p);return [ORG[0]+s[0]*SCALE,ORG[1]+s[1]*SCALE,s[2]];};}
function fit(){let sm=Infinity,save=az,cx=0,cy=0;const B=FIGBOX;
 for(let a=0;a<360;a+=15){az=a;const pr=cam();let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of B){const s=pr(p);x0=Math.min(x0,s[0]);x1=Math.max(x1,s[0]);y0=Math.min(y0,s[1]);y1=Math.max(y1,s[1]);}
 sm=Math.min(sm,Math.min((W-60)/(x1-x0),(H-70)/(y1-y0)));}
 az=save;SCALE=sm*1.3;}
function center(){const pr=cam();let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of FIGBOX){const s=pr(p);x0=Math.min(x0,s[0]);x1=Math.max(x1,s[0]);y0=Math.min(y0,s[1]);y1=Math.max(y1,s[1]);}
 ORG=[W/2-(x0+x1)/2*SCALE+(OVERLAY_SHIFT||0),H/2+8-(y0+y1)/2*SCALE];}
const svg=document.getElementById('fig');
function draw(){faces=[];labels=[];const info=SCENE(phi);center();const pr=cam(),P=project(pr);
 const camd=[0,0,1];let out='';const vis=[];
 for(const f of faces){const s=f.q.map(P);let ar=0;for(let i=0;i<s.length;i++){const j=(i+1)%s.length;ar+=s[i][0]*s[j][1]-s[j][0]*s[i][1];}
  if(ar>=-1e-6)continue; // screen y down: visible faces are counter-clockwise in math sense -> negative
  const d=s.reduce((a,b)=>a+b[2],0)/s.length;const n0=crs(sub(f.q[1],f.q[0]),sub(f.q[2],f.q[0]));const a=az*D,e=el*D;
  const nx=n0[0]*Math.cos(a)-n0[1]*Math.sin(a),ny=n0[0]*Math.sin(a)+n0[1]*Math.cos(a);const nc=nrm([nx,-(ny*Math.sin(e)+n0[2]*Math.cos(e)),-ny*Math.cos(e)+n0[2]*Math.sin(e)]);
  const cd=pr(f.c)[2];vis.push({s,d:cd*0.35+d*0.65+(f.bias||0),col:shade(f.tone,[nc[0],-nc[1],nc[2]])});}
 vis.sort((a,b)=>a.d-b.d);
 out+='<g stroke="#3a3a37" stroke-width=".55" stroke-linejoin="round">';
 for(const v of vis)out+='<path d="M'+v.s.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z" fill="'+v.col+'"/>';
 out+='</g><g font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="10.5" fill="#2c2c2a">';
 for(const l of labels){const s=P(l.p);const tx=s[0]+l.dx,ty=s[1]+l.dy;out+='<path d="M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+'L'+tx.toFixed(1)+' '+(ty+3).toFixed(1)+'" stroke="#2c2c2a" stroke-width=".6" fill="none"/><circle cx="'+s[0].toFixed(1)+'" cy="'+s[1].toFixed(1)+'" r="1.6"/><text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle" paint-order="stroke" stroke="#d9d9d6" stroke-width="3">'+l.t+'</text>';}
 out+='</g>'+(info.overlay||'')+'<text x="18" y="24" font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="11" fill="#2c2c2a">'+info.readout+'</text>';
 svg.innerHTML=out;}
// lift chart overlay: curves = [{f:(ph)=>0..1, col, dash}], marker at ph
function chart(curves,ph,x=520,y=300,w=184,h=70,title=''){let o='<g font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="9" fill="#44443f"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#e8e8e5" stroke="#9a9a95" stroke-width=".6"/>';
 o+='<text x="'+(x+5)+'" y="'+(y+11)+'">'+title+'</text>';
 for(const c of curves){let d='';for(let i=0;i<=144;i++){const p=i*5;d+=(i?'L':'M')+(x+4+p/720*(w-8)).toFixed(1)+' '+(y+h-6-c.f(p)*(h-22)).toFixed(1);}o+='<path d="'+d+'" fill="none" stroke="'+c.col+'" stroke-width="1.3"'+(c.dash?' stroke-dasharray="3 2"':'')+'/>';}
 const mx=x+4+mod(ph,720)/720*(w-8);o+='<path d="M'+mx.toFixed(1)+' '+(y+14)+'V'+(y+h-4)+'" stroke="#2c2c2a" stroke-width=".7"/>';
 o+='<text x="'+(x+w-4)+'" y="'+(y+h+10)+'" text-anchor="end">曲轴 0–720°</text></g>';return o;}
function tick(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;phi=(phi+dt*SPEED)%TOTAL;draw();raf=run?requestAnimationFrame(tick):0;}
window.FIG={play(on){run=!!on;if(run&&!raf){last=0;raf=requestAnimationFrame(tick);}},reset(){az=AZ0;el=EL0;draw();},playing(){return run;},setPhi(p){phi=p;draw();},view(a,e){az=a;el=e;draw();}};
let dr=null;svg.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!dr)return;az=(az+(e.clientX-dr[0])*.45)%360;el=Math.max(8,Math.min(70,el+(e.clientY-dr[1])*.3));dr=[e.clientX,e.clientY];draw();});
svg.addEventListener('pointerup',()=>dr=null);svg.addEventListener('pointercancel',()=>dr=null);
fit();draw();

</script>
<script src="_embed-lite.js"></script></body></html>
