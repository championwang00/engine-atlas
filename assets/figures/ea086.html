<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mazda 13B / RENESIS 双转子</title>
<style>html,body{margin:0;background:#d9d9d6}#fig{display:block;width:100%;max-width:960px;height:auto;margin:0 auto;touch-action:none;cursor:grab;user-select:none}</style></head><body>
<svg id="fig" viewBox="0 0 720 440" role="img" aria-label="Mazda 13B / RENESIS 双转子剖视等轴测动画"></svg>
<script>
const TITLE="Mazda 13B / RENESIS 双转子",AZ0=-42,EL0=30,SPEED=1.6,T0=1;
function MODEL(S,t){
const M1='#c7c7c2',M2='#b0b0ab',M3='#9a9a95',DK='#6d6d69',CUT='#e6e1d7',HOT='#e0703a',AIR='#a9b8c6',EXH='#9b958d',COP='#c4a27f';

function wankel(S,phi,o){const R=o.R||105,e=o.e||15,b=o.b||80,y0=o.y0||0,D=S.D;
 const F=[[o.x0||0,y0,0],[1,0,0],[0,0,1],[0,1,0]];
 const epi=[];for(let i=0;i<120;i++){const a=i/120*2*Math.PI;epi.push([R*Math.cos(a)+e*Math.cos(3*a),R*Math.sin(a)+e*Math.sin(3*a)])}
 const A=R+e+30,B=R-e+34,out=[];for(let i=0;i<48;i++){const a=i/48*2*Math.PI,c=Math.cos(a),s=Math.sin(a);out.push([A*Math.sign(c)*Math.pow(Math.abs(c),.55),B*Math.sign(s)*Math.pow(Math.abs(s),.55)])}
 // rear side housing (plate) with ports
 S.ext(F,out.map(p=>[p[0]*1.04,p[1]*1.06]),b,b+16,M3,{});
 // gas chambers on plate face
 const rc=[e*Math.cos(phi),e*Math.sin(phi)],rr=phi/3;
 const apex=k=>[rc[0]+R*Math.cos(rr+k*2*Math.PI/3),rc[1]+R*Math.sin(rr+k*2*Math.PI/3)];
 const flank=(k,n=16)=>{const p=apex(k),q=apex(k+1),m=[(p[0]+q[0])/2,(p[1]+q[1])/2];const dx=m[0]-rc[0],dy=m[1]-rc[1],dl=Math.hypot(dx,dy);const bul=13;
  const c=[m[0]+dx/dl*bul,m[1]+dy/dl*bul];const r=[];for(let i=0;i<=n;i++){const s=i/n;r.push([(1-s)*(1-s)*p[0]+2*s*(1-s)*c[0]+s*s*q[0],(1-s)*(1-s)*p[1]+2*s*(1-s)*c[1]+s*s*q[1]])}return r};
 const area=pts=>{let s=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];s+=p[0]*q[1]-q[0]*p[1]}return Math.abs(s)/2};
 const chamber=(ph,k)=>{const rrr=ph/3,a0=rrr+k*2*Math.PI/3,pts=[];for(let i=0;i<=30;i++){const a=a0+i/30*2*Math.PI/3;pts.push([R*Math.cos(a)+e*Math.cos(3*a),R*Math.sin(a)+e*Math.sin(3*a)])}return pts};
 const res=[];
 for(let k=0;k<3;k++){const hs=chamber(phi,k);const fl=flank(k).reverse();const poly=hs.concat(fl);
  const V=area(poly),V2=area(chamber(phi+.02,k).concat(flank(k).reverse()));
  // use centroid side and volume trend
  let cx=0,cy=0;hs.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=hs.length;cy/=hs.length;
  const vt=area(chamberAt(phi+.03,k));const vn=area(chamberAt(phi,k));const inc=vt>vn;
  const top=cy>0;const ph=top?(inc?'进气':'排气'):(inc?'做功':'压缩');
  const col=ph=='做功'?HOT:ph=='进气'?AIR:ph=='排气'?EXH:'#cfcabc';
  S.poly(poly.map(p=>[(o.x0||0)+p[0],y0+b-.4,p[1]]),col,[0,-1,0],{bias:1});
  res.push({ph,c:[(o.x0||0)+cx*.8+rc[0]*.2,y0+b*0.0,cy*.8+rc[1]*.2],V});}
 function chamberAt(ph,k){const rr2=ph/3,rc2=[e*Math.cos(ph),e*Math.sin(ph)];const ap=j=>[rc2[0]+R*Math.cos(rr2+j*2*Math.PI/3),rc2[1]+R*Math.sin(rr2+j*2*Math.PI/3)];
  const p=ap(k),q=ap(k+1),m=[(p[0]+q[0])/2,(p[1]+q[1])/2];const dx=m[0]-rc2[0],dy=m[1]-rc2[1],dl=Math.hypot(dx,dy);const c=[m[0]+dx/dl*13,m[1]+dy/dl*13];
  const fl=[];for(let i=16;i>=0;i--){const s=i/16;fl.push([(1-s)*(1-s)*p[0]+2*s*(1-s)*c[0]+s*s*q[0],(1-s)*(1-s)*p[1]+2*s*(1-s)*c[1]+s*s*q[1]])}
  return chamber(ph,k).concat(fl)}
 if(o.sidePorts){// RENESIS: side intake and side exhaust ports on the side housing
  const port=(pts,c)=>S.poly(pts.map(p=>[(o.x0||0)+p[0],y0+b-.8,p[1]]),c,[0,-1,0],{bias:1.5});
  port([[-70,40],[-40,52],[-36,30],[-62,22]],'#4f5a63');port([[-80,18],[-58,10],[-56,-2],[-78,2]],'#4f5a63');
  port([[40,52],[70,40],[62,22],[38,30]],'#3d3a36');port([[58,10],[80,18],[78,2],[56,-2]],'#3d3a36');}
 // housing (trochoid) cut: front face is the section
 S.ext(F,out,0,b,M2,{holes:[epi],frontCol:CUT,frontBias:30});
 // eccentric shaft + lobe + stationary gear
 S.cylY([o.x0||0,0,0],21,y0-(o.shaftF||60),y0+b+40,M1,{bias:-2});
 S.ext([[ (o.x0||0)+rc[0],y0,rc[1]],[1,0,0],[0,0,1],[0,1,0]],S.circ(36,28),6,b/2,M2,{bias:3});
 S.ext([[o.x0||0,y0,0],[1,0,0],[0,0,1],[0,1,0]],S.gear(30,20,4),b/2,b,DK,{});
 // rotor with internal gear (3e) ; rotates phi/3
 const rot=[];for(let k=0;k<3;k++)rot.push(...flank(k,14).slice(0,-1));
 const ig=S.gear(45,30,4).map(p=>S.rot2([p],rr)[0]).map(p=>[p[0]+rc[0],p[1]+rc[1]]);
 S.ext(F,rot,4,b-4,M1,{holes:[ig],bias:5});
 // apex seals
 for(let k=0;k<3;k++){const p=apex(k),a=rr+k*2*Math.PI/3;const ux=Math.cos(a),uy=Math.sin(a);
  S.ext(F,[[p[0]-ux*8-uy*1.6,p[1]-uy*8+ux*1.6],[p[0]+ux*.5-uy*1.6,p[1]+uy*.5+ux*1.6],[p[0]+ux*.5+uy*1.6,p[1]+uy*.5-ux*1.6],[p[0]-ux*8+uy*1.6,p[1]-uy*8-ux*1.6]],3,b-3,DK,{bias:6})}
 // spark plugs (leading / trailing) at bottom, exhaust & intake stubs at top
 for(const x of [-16,20]){S.cylZ([(o.x0||0)+x,y0+b/2,0],7,-(R-e)-60,-(R-e)-22,M3,{});S.cylZ([(o.x0||0)+x,y0+b/2,0],4,-(R-e)-74,-(R-e)-60,'#e9e9e6',{})}
 if(!o.sidePorts){S.cylZ([(o.x0||0)+50,y0+b/2,0],15,R-e+20,R-e+70,EXH,{});S.cylZ([(o.x0||0)-50,y0+b/2,0],18,R-e+20,R-e+70,AIR,{})}
 S.cylY([o.x0||0,0,0],44,y0-(o.shaftF||60)+4,y0-(o.shaftF||60)+18,M2,{n:32});
 return res;}

 const phi=t;
 const r2=wankel(S,phi+Math.PI,{y0:330,R:105,e:15,b:80,shaftF:230,sidePorts:1});
 S.ext([[0,200,0],[1,0,0],[0,0,1],[0,1,0]],S.circ(150,40).map(p=>[p[0],p[1]*.86]),0,20,M3,{noFront:0});
 const r1=wankel(S,phi,{y0:0,R:105,e:15,b:80,shaftF:70,sidePorts:1});
 for(const c of r1)S.label(c.c,c.ph);
 S.label([-60,79,45],'侧进气口',-120,-110);S.label([60,79,45],'侧排气口',150,-130);S.label([0,330,-60],'后转子（偏心相差180°）',90,90);}
function READOUT(t){const a=((t*180/Math.PI)%1080+1080)%1080;return '偏心轴 '+Math.round(a%360)+'° · 转子 '+Math.round(a/3)+'° (3:1) · 两转子偏心相差 180° · 2×654 cc · 沿轴分解示意'}
// shared runtime: tiny orthographic iso renderer with painter sort, four-tone shading
(()=>{
const svg=document.getElementById('fig');
const D=Math.PI/180;
let az=AZ0*D,el=EL0*D,t=0,on=false,last=0,SC=1,CX=360,CY=240,C0=[0,0,0];
const H2=c=>{c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]};
const mixc=(a,b,f)=>{a=H2(a);b=H2(b);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*f).toString(16).padStart(2,'0')).join('')};
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
function cam(p){const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
 const x=p[0]-C0[0],y0=p[1]-C0[1],z=p[2]-C0[2];const X=x*ca-y0*sa,Y=x*sa+y0*ca;
 return[CX+X*SC,CY-(z*ce+Y*se)*SC,Y*ce-z*se]}
function camN(n){const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
 const X=n[0]*ca-n[1]*sa,Y=n[0]*sa+n[1]*ca;return[X,n[2]*ce+Y*se,Y*ce-n[2]*se]}
const L=(()=>{const v=[-.45,.8,-.4],m=Math.hypot(...v);return v.map(a=>a/m)})();
function tone(col,n){if(!n)return col;let c=camN(n);if(c[2]>0)c=c.map(a=>-a);
 const k=c[0]*L[0]+c[1]*L[1]+c[2]*L[2];const q=k>.75?0:k>.4?1:k>.05?2:3;
 return q==0?mixc(col,'#ffffff',.18):mixc(col,'#1b1b1d',[0,.1,.22,.34][q])}
let items=[];
const S={
 D,
 poly(pts,col,n,o={}){items.push({k:'p',pts,col,n,o})},
 line(pts,col,w=1.2,o={}){items.push({k:'l',pts,col,w,o})},
 label(p,text,dx=0,dy=0){items.push({k:'t',p,text,dx,dy})},
 // extrude 2D outline (u,v) along W from w0..w1 in frame O,U,V,W
 ext(F,pts,w0,w1,col,o={}){const[O,U,V,W]=F;const m=(u,v,w)=>add(add(add(O,mul(U,u)),mul(V,v)),mul(W,w));
  const ar=a=>{let s=0;for(let i=0;i<a.length;i++){const p=a[i],q=a[(i+1)%a.length];s+=p[0]*q[1]-q[0]*p[1]}return s};
  const caps=[pts,...(o.holes||[])];
  const capCol=o.cap||col;
  if(!o.noBack)S.poly(caps.map(r=>r.map(p=>m(p[0],p[1],w1))),o.backCol||capCol,W,{...o,sub:1});
  const sides=(r,hole)=>{const sg=Math.sign(ar(r))*(hole?-1:1);for(let i=0;i<r.length;i++){const p=r[i],q=r[(i+1)%r.length];
   const du=q[0]-p[0],dv=q[1]-p[1];const n=add(mul(U,dv*sg),mul(V,-du*sg));
   const c=o.side?o.side(i,hole):col;if(c===null)continue;
   S.poly([m(p[0],p[1],w0),m(q[0],q[1],w0),m(q[0],q[1],w1),m(p[0],p[1],w1)],c,n,{smooth:o.smooth,bias:o.bias})}};
  if(!o.noSides){sides(pts,false);(o.holes||[]).forEach(h=>sides(h,true))}
  if(!o.noFront)S.poly(caps.map(r=>r.map(p=>m(p[0],p[1],w0))),o.frontCol||capCol,mul(W,-1),{...o,sub:1,bias:(o.bias||0)+(o.frontBias||0)});
 },
 circ(r,n=28,a0=0,a1=360,cx=0,cy=0){const o=[];const full=a1-a0>=360;const N=full?n:n+1;for(let i=0;i<N;i++){const a=(a0+(a1-a0)*i/(full?n:n))*D;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return o},
 ring(r0,r1,a0,a1,n=24){const a=S.circ(r1,n,a0,a1),b=S.circ(r0,n,a0,a1).reverse();return a.concat(b)},
 gear(r,teeth,h,rot=0){const o=[];for(let i=0;i<teeth*4;i++){const a=rot+i/(teeth*4)*2*Math.PI;const rr=(i%4<2)?r+h/2:r-h/2;o.push([rr*Math.cos(a+(i%4==1||i%4==3?0:0)),rr*Math.sin(a)])}return o},
 rot2(pts,a,cx=0,cy=0){const c=Math.cos(a),s=Math.sin(a);return pts.map(p=>[cx+p[0]*c-p[1]*s,cy+p[0]*s+p[1]*c])},
 // frames
 FXZ:(y=0)=>[[0,y,0],[1,0,0],[0,0,1],[0,1,0]], // mechanism plane x-z, depth +y
 FYZ:(x=0)=>[[x,0,0],[0,1,0],[0,0,1],[1,0,0]], // axis along x
 FXY:(z=0)=>[[0,0,z],[1,0,0],[0,1,0],[0,0,1]], // axis along z
 // cylinder along an axis through point c
 cylX(c,r,x0,x1,col,o={}){S.ext([[0,c[1],c[2]],[0,1,0],[0,0,1],[1,0,0]],S.circ(r,o.n||24),x0,x1,col,{smooth:1,...o})},
 cylY(c,r,y0,y1,col,o={}){S.ext([[c[0],0,c[2]],[1,0,0],[0,0,1],[0,1,0]],S.circ(r,o.n||24),y0,y1,col,{smooth:1,...o})},
 cylZ(c,r,z0,z1,col,o={}){S.ext([[c[0],c[1],0],[1,0,0],[0,1,0],[0,0,1]],S.circ(r,o.n||24),z0,z1,col,{smooth:1,...o})},
 box(c,s,col,o={}){const[x,y,z]=c,[a,b,h]=s;S.ext([[x,y,z-h/2],[1,0,0],[0,1,0],[0,0,1]],[[-a/2,-b/2],[a/2,-b/2],[a/2,b/2],[-a/2,b/2]],0,h,col,o)},
 // bar between two points in the x-z plane at depth y0..y1 (conrod)
 bar(p,q,wd,y0,y1,col,o={}){const du=q[0]-p[0],dv=q[1]-p[1],l=Math.hypot(du,dv),nu=-dv/l*wd/2,nv=du/l*wd/2;
  S.ext(S.FXZ(),[[p[0]+nu,p[1]+nv],[q[0]+nu,q[1]+nv],[q[0]-nu,q[1]-nv],[p[0]-nu,p[1]-nv]],y0,y1,col,o)},
 mixc
};
function frame(){items=[];MODEL(S,t);return items}
function fit(){const sv=[az,el,SC,CX,CY];SC=1;CX=0;CY=0;let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
 // world bbox centre
 frame();let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];C0=[0,0,0];
 for(const it of items)if(it.k=='p')for(const r of(it.o.sub?it.pts:[it.pts]))for(const p of r)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i])}
 C0=lo.map((v,i)=>(v+hi[i])/2);let sc=9;
 for(const A of[-70,-40,-10,20,50,70])for(const E of[8,30,58]){az=A*D;el=E*D;mnx=1e9;mxx=-1e9;mny=1e9;mxy=-1e9;
  for(const it of items){if(it.k!='p')continue;for(const r of(it.o.sub?it.pts:[it.pts]))for(const p of r){const c=cam(p);mnx=Math.min(mnx,c[0]);mxx=Math.max(mxx,c[0]);mny=Math.min(mny,c[1]);mxy=Math.max(mxy,c[1])}}
  sc=Math.min(sc,680/(2*Math.max(-mnx,mxx)),360/(2*Math.max(-mny,mxy)))}
 [az,el]=sv;SC=sc;CX=360;CY=246}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function draw(){frame();const out=[];
 for(const it of items){
  if(it.k=='p'){const rings=it.o.sub?it.pts:[it.pts];const pr=rings.map(r=>r.map(cam));let d=0,n=0;for(const r of pr)for(const c of r){d+=c[2];n++}
   it.d=d/n-(it.o.bias||0);it.pr=pr}
  else if(it.k=='l'){it.pr=it.pts.map(cam);it.d=it.pr.reduce((a,c)=>a+c[2],0)/it.pr.length-(it.o.bias||0)}
  else{it.pr=[cam(it.p)];it.d=-1e9}}
 items.sort((a,b)=>b.d-a.d);
 for(const it of items){
  if(it.k=='p'){const f=tone(it.col,it.n);const dd=it.pr.map(r=>'M'+r.map(c=>c[0].toFixed(1)+' '+c[1].toFixed(1)).join('L')+'Z').join('');
   const st=it.o.smooth?f:mixc(it.col,'#1b1b1d',.5);
   out.push(`<path d="${dd}" fill="${f}" fill-rule="evenodd" stroke="${st}" stroke-width="${it.o.smooth?.5:.6}" stroke-linejoin="round"${it.o.op?` fill-opacity="${it.o.op}"`:''}/>`)}
  else if(it.k=='l'){const dd='M'+it.pr.map(c=>c[0].toFixed(1)+' '+c[1].toFixed(1)).join('L');
   out.push(`<path d="${dd}" fill="none" stroke="${it.col}" stroke-width="${it.w}" stroke-linecap="round" stroke-linejoin="round"${it.o.dash?` stroke-dasharray="${it.o.dash}" stroke-dashoffset="${(-(it.o.flow||0)*t*60).toFixed(1)}"`:''}${it.o.op?` opacity="${it.o.op}"`:''}/>`)}
  else if(!it.dx&&!it.dy){out.push(`<text x="${it.pr[0][0].toFixed(1)}" y="${(it.pr[0][1]+4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d1d1b" font-family="ui-monospace,Menlo,monospace">${esc(it.text)}</text>`)}
  else{let[x,y]=[it.pr[0][0],it.pr[0][1]];const lx=Math.max(8,Math.min(712,x+it.dx)),ly=Math.max(52,Math.min(420,y+it.dy));
   out.push(`<path d="M${x.toFixed(1)} ${y.toFixed(1)}L${lx.toFixed(1)} ${ly.toFixed(1)}" stroke="#55554f" stroke-width=".6" fill="none"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="#343432"/><text x="${lx.toFixed(1)}" y="${(ly+(it.dy<0?-3:10)).toFixed(1)}" text-anchor="${it.dx<0?'end':it.dx>0?'start':'middle'}" font-size="10.5" fill="#2a2a28" font-family="ui-monospace,Menlo,monospace">${esc(it.text)}</text>`)}}
 const ro=READOUT(t);
 svg.innerHTML=`<rect width="720" height="440" fill="#d9d9d6"/><text x="16" y="24" font-size="13" font-weight="600" fill="#1d1d1b" font-family="ui-sans-serif,-apple-system,system-ui,sans-serif">${esc(TITLE)}</text><text x="16" y="42" font-size="10.5" fill="#4a4a46" font-family="ui-monospace,Menlo,monospace">${esc(ro)}</text>`+out.join('');}
function loop(ts){if(!on)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;t+=dt*SPEED;draw();requestAnimationFrame(loop)}
function reset(){az=AZ0*D;el=EL0*D;t=T0;draw()}
window.FIG={play(v){on=!!v;last=0;if(on)requestAnimationFrame(loop)},reset,playing:()=>on,
 _set(o){if('az'in o)az=o.az*D;if('el'in o)el=o.el*D;if('t'in o)t=o.t;draw()},_count:()=>{frame();return items.length}};
let drag=null;
svg.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,az,el];svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),k=720/r.width;
 az=Math.max(-75*D,Math.min(75*D,drag[2]+(e.clientX-drag[0])*k*.006));el=Math.max(6*D,Math.min(60*D,drag[3]+(e.clientY-drag[1])*k*.005));if(!on)draw()});
svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
svg.tabIndex=0;svg.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')az=Math.max(-75*D,az-5*D);else if(e.key=='ArrowRight')az=Math.min(75*D,az+5*D);else return;e.preventDefault();if(!on)draw()});
t=T0;fit();draw();
})();

</script>
