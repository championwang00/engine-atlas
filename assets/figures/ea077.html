<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>生物柴油与 HVO</title><style>html,body{margin:0;background:#d9d9d6}#fig{display:block;width:100%;max-width:960px;margin:0 auto;height:auto;touch-action:none;cursor:grab}</style></head><body><svg id="fig" viewBox="0 0 720 440" role="img" aria-label="生物柴油与 HVO"></svg><script>const IRON='#7e7d77',DARK='#55544f',STEEL='#b9b9b3',BRASS='#bf9a50',WHITE='#ecece8',FLOOR='#cdcdc8',OR='#e07a2e',BLUE='#3e63dd',GREEN='#30a46c',AMBER='#d69a2d',RED='#e5484d',GREY='#8d8d92';
const floor=(k,x0,y0,x1,y1)=>k.box(x0,y0,-2,x1,y1,0,FLOOR,{bias:-1e5});
const TAU=Math.PI*2;
window.SCENE={az:-30,el:30,draw:function(k){const T=k.T;
 floor(k,-130,-66,130,66);
 for(const[x,y]of[[-112,-10],[-112,10],[-96,0]])k.cyl(x,y,0,24,8,'#8f9a4e',18);for(const[x,y]of[[-112,-10],[-112,10],[-96,0]])k.cyl(x,y,24,25,6,DARK,16);
 const A=[[-88,0,12],[-70,0,12],[-70,-40,12],[-54,-40,12]],B=[[-70,0,12],[-70,40,12],[-50,40,12]];k.pipe(A,1.8,STEEL);k.pipe(B,1.8,STEEL);k.flow(A,6,.4,'#a5a83a',1.5);k.flow(B,5,.4,'#a5a83a',1.5,.3);
 k.cyl(-40,-40,0,34,13,'#b2b2ac',26);k.cyl(-40,-40,34,37,14,DARK,26);k.box(-44,-44,37,-36,-36,45,IRON);
 const a=T*4;k.rod([-40+9*Math.cos(a),-40+9*Math.sin(a),40],[-40-9*Math.cos(a),-40-9*Math.sin(a),40],1,1,STEEL,6);
 k.cyl(-62,-58,0,20,6,'#b7c4de',16);k.pipe([[-62,-58,20],[-62,-58,28],[-48,-46,30]],1.2,STEEL);k.flow([[-62,-58,24],[-62,-58,28],[-48,-46,30]],3,.5,'#5b8def',1.1);
 k.cyl(-18,-60,0,12,5,'#d6c78e',16);k.pipe([[-30,-48,6],[-18,-60,6]],1.2,STEEL);
 k.cyl(-40,40,0,64,8.5,'#a9a9a3',22);for(const z of[16,32,48])k.cyl(-40,40,z,z+2.5,9.6,OR,22,{caps:false});k.sph([-40,40,64],8.5,'#a9a9a3');
 k.sph([-64,60,10],9,'#c7d0e4');k.pipe([[-64,60,20],[-64,60,30],[-48,44,30]],1.2,STEEL);k.flow([[-64,60,22],[-64,60,30],[-48,44,30]],3,.5,BLUE,1.1);
 const F1=[[-26,-40,14],[10,-40,14]],H1=[[-31,40,14],[10,40,14]];k.pipe(F1,1.8,STEEL);k.pipe(H1,1.8,STEEL);k.flow(F1,5,.5,AMBER,1.5);k.flow(H1,5,.5,'#c9a227',1.5);
 k.cyl(20,-40,0,30,10,'#d9c48a',22);k.cyl(20,40,0,30,10,'#e2d6a6',22);k.cyl(26,0,0,22,8,'#8c8a80',20);
 const F2=[[30,-40,10],[50,-40,10],[50,-6,10],[64,-6,10]],H2=[[30,40,10],[56,40,10],[56,6,10],[64,6,10]],D2=[[34,0,10],[64,0,10]];
 for(const P of[F2,H2,D2])k.pipe(P,1.6,STEEL);k.flow(F2,4,.5,AMBER,1.3);k.flow(H2,6,.5,'#c9a227',1.4);k.flow(D2,4,.5,'#555',1.3);
 k.box(64,-22,0,112,22,28,IRON);k.box(62,-24,28,114,24,38,DARK);for(let i=0;i<4;i++)k.cyl(72+i*11,0,38,46,2,STEEL,10);k.rod([112,0,16],[118,0,16],14,14,DARK,28,{rot:T*6});
 k.lab([-104,0,26],'油脂原料（植物油/废食用油）',{dy:-10});k.lab([-40,-40,46],'酯交换 + 甲醇',{dy:-8});k.lab([-18,-60,12],'副产甘油',{dy:16});
 k.lab([-40,40,73],'加氢处理 + H₂',{dy:-6});k.lab([20,-40,30],'FAME 生物柴油',{dy:-8});k.lab([20,40,30],'HVO 可再生柴油',{dy:-8,dx:-10,anchor:'end'});
 k.lab([50,-40,10],'掺混上限约 7%（EN 590）',{dy:18,dx:10});k.lab([40,40,30],'HVO：0–100% 掺混即用',{dy:-24,dx:0});k.lab([26,0,0],'化石柴油',{dy:16});k.lab([88,0,46],'普通柴油机',{dy:-8});}};</script><script>(function(){
const D=Math.PI/180, svg=document.getElementById('fig');
const SC=window.SCENE; let AZ0=SC.az??-38, EL0=SC.el??26, az=AZ0, el=EL0, T=0, on=false, last=0, raf=0;
let objs, dots, labs, C=[0,0,0], S=1, CX=0, CY=0;
const hex=c=>{c=c.replace('#','');return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16))};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(...a)||1;return mul(a,1/l)};
function mk(faces,col,o={}){objs.push({faces,col,bias:o.bias||0,two:o.two,glow:o.glow})}
const K={
 box(x0,y0,z0,x1,y1,z1,col,o){const p=(x,y,z)=>[x,y,z];mk([[p(x0,y0,z0),p(x1,y0,z0),p(x1,y1,z0),p(x0,y1,z0)],[p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],[p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],[p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)],[p(x0,y0,z0),p(x0,y1,z0),p(x0,y1,z1),p(x0,y0,z1)],[p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)]],col,o)},
 rod(p,q,r0,r1,col,n=16,o={}){const d=norm(sub(q,p)),a=Math.abs(d[2])<.9?[0,0,1]:[1,0,0],e1=norm(cross(a,d)),e2=cross(d,e1);
  const A=[],B=[];for(let i=0;i<n;i++){const t=i/n*2*Math.PI+(o.rot||0),v=add(mul(e1,Math.cos(t)),mul(e2,Math.sin(t)));A.push(add(p,mul(v,r0)));B.push(add(q,mul(v,r1)))}
  const f=[];for(let i=0;i<n;i++){const j=(i+1)%n;f.push([A[i],A[j],B[j],B[i]])}if(o.caps!==false){if(r0>0.05)f.push(A.slice().reverse());if(r1>0.05)f.push(B)}mk(f,col,o)},
 cyl(x,y,z0,z1,r,col,n,o){K.rod([x,y,z0],[x,y,z1],r,r,col,n,o)},
 sph(c,r,col,o){const f=[],la=6,lo=10,P=(i,j)=>{const th=i/la*Math.PI,ph=j/lo*2*Math.PI;return [c[0]+r*Math.sin(th)*Math.cos(ph),c[1]+r*Math.sin(th)*Math.sin(ph),c[2]+r*Math.cos(th)]};
  for(let i=0;i<la;i++)for(let j=0;j<lo;j++)f.push([P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)]);mk(f,col,o)},
 pipe(pts,r,col,n=10){for(let i=0;i<pts.length-1;i++)K.rod(pts[i],pts[i+1],r,r,col,n,{caps:true});for(let i=1;i<pts.length-1;i++)K.sph(pts[i],r*1.02,col)},
 dot(p,r,col,a=1){dots.push({p,r,col,a})},
 flow(pts,n,speed,col,r=1.6,ph=0){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(...sub(pts[i],pts[i-1])));const tot=L[L.length-1];
  for(let k=0;k<n;k++){let s=(((k/n+T*speed+ph)%1)+1)%1*tot,i=1;while(i<L.length-1&&L[i]<s)i++;const f=(s-L[i-1])/(L[i]-L[i-1]||1);dots.push({p:add(pts[i-1],mul(sub(pts[i],pts[i-1]),f)),r,col,a:1})}},
 lab(p,text,o={}){labs.push({p,text,dx:o.dx||0,dy:o.dy||-8,anchor:o.anchor||'middle',tone:o.tone})},
 get T(){return T}
};
function V(p){const ca=Math.cos(az*D),sa=Math.sin(az*D),ce=Math.cos(el*D),se=Math.sin(el*D),x=p[0]-C[0],y=p[1]-C[1],z=p[2]-C[2],u=x*ca-y*sa,v=x*sa+y*ca;return [u,z*ce+v*se,-v*ce+z*se]}
function build(){objs=[];dots=[];labs=[];SC.draw(K)}
function fit(){build();let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];for(const o of objs)for(const f of o.faces)for(const p of f)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i])}
 C=mul(add(lo,hi),.5);let W=0,H=0;const a0=az,e0=el;for(let a=AZ0-45;a<=AZ0+45;a+=15)for(const e of [Math.max(8,EL0-12),EL0,EL0+22]){az=a;el=e;for(const o of objs)for(const f of o.faces)for(const p of f){const v=V(p);W=Math.max(W,Math.abs(v[0]));H=Math.max(H,Math.abs(v[1]))}}
 az=a0;el=e0;S=Math.min(338/W,196/H)*(SC.zoom||1);CX=360;CY=220}
const L=norm([-.45,.75,.55]);
function rgb(c,k){const h=hex(c);return 'rgb('+h.map(v=>Math.round(Math.min(255,v*k))).join(',')+')'}
function render(){build();const out=[];const items=[];
 for(const o of objs){let d=0,n=0;for(const f of o.faces)for(const p of f){d+=V(p)[2];n++}items.push({d:d/n+o.bias,o})}
 for(const q of dots)items.push({d:V(q.p)[2]+.5,q});
 items.sort((a,b)=>a.d-b.d);
 for(const it of items){if(it.q){const v=V(it.q.p);out.push(`<circle cx="${(CX+S*v[0]).toFixed(1)}" cy="${(CY-S*v[1]).toFixed(1)}" r="${Math.max(1.2,it.q.r*S).toFixed(1)}" fill="${it.q.col}" fill-opacity="${it.q.a}" stroke="#ffffff" stroke-opacity=".55" stroke-width=".6"/>`);continue}
  const o=it.o,fs=[];for(const f of o.faces){const vs=f.map(V);let nn=[0,0,0];for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length];nn[0]+=(a[1]-b[1])*(a[2]+b[2]);nn[1]+=(a[2]-b[2])*(a[0]+b[0]);nn[2]+=(a[0]-b[0])*(a[1]+b[1])}
   nn=norm(nn);let cen=[0,0,0];vs.forEach(v=>cen=add(cen,v));cen=mul(cen,1/vs.length);let oc=[0,0,0],m=0;for(const g of o.faces)for(const p of g){oc=add(oc,V(p));m++}oc=mul(oc,1/m);
   if(dot(nn,sub(cen,oc))<0)nn=mul(nn,-1);if(nn[2]<=0.001){if(!o.two)continue;nn=mul(nn,-1)}
   const lam=Math.max(0,dot(nn,L)),k=o.glow?1:(.6+.48*lam);fs.push({d:cen[2],s:`<path d="M${vs.map(v=>(CX+S*v[0]).toFixed(1)+' '+(CY-S*v[1]).toFixed(1)).join('L')}Z" fill="${rgb(o.col,k)}"/>`})}
  fs.sort((a,b)=>a.d-b.d);out.push('<g stroke="#2b2b28" stroke-opacity=".32" stroke-width=".55" stroke-linejoin="round">'+fs.map(x=>x.s).join('')+'</g>')}
 for(const l of labs){const v=V(l.p);let x=CX+S*v[0]+l.dx,y=CY-S*v[1]+l.dy;x=Math.max(70,Math.min(650,x));y=Math.max(14,Math.min(430,y));
  out.push(`<circle cx="${(CX+S*v[0]).toFixed(1)}" cy="${(CY-S*v[1]).toFixed(1)}" r="1.6" fill="#26262a"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${l.anchor}" font-size="11" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" fill="${l.tone||'#26262a'}" stroke="#e4e4e0" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${l.text}</text>`)}
 svg.innerHTML=out.join('')}
function loop(ts){raf=0;if(!on)return;const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;T+=dt;render();raf=requestAnimationFrame(loop)}
function play(v){on=!!v;last=0;if(on&&!raf)raf=requestAnimationFrame(loop)}
let dx=null,dy=0,pend=0;
svg.addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY;svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(dx===null)return;az=(az+(e.clientX-dx)*.45)%360;el=Math.min(60,Math.max(8,el+(e.clientY-dy)*.3));dx=e.clientX;dy=e.clientY;if(!pend)pend=requestAnimationFrame(()=>{pend=0;render()})});
const rel=()=>{dx=null};svg.addEventListener('pointerup',rel);svg.addEventListener('pointercancel',rel);
svg.addEventListener('dblclick',()=>{az=AZ0;el=EL0;render()});
svg.setAttribute('tabindex','0');
svg.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0;if(d){e.preventDefault();az+=d;render()}if(e.key===' '){e.preventDefault();play(!on)}});
fit();render();
window.FIG={play,reset(){play(false);az=AZ0;el=EL0;T=0;render()},playing:()=>on};
window.__fig={view(a,e){az=a;el=e;render()},setT(t){T=t;render()}};
})();
</script><script src="_embed-lite.js"></script></body></html>
