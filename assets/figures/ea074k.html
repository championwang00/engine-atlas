function render(items,az,el,fit){
  const v=makeView(az,el),S=fit.scale;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of fit.P){const q=v.rot(p);x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
  const ox=W/2-S*(x0+x1)/2,oy=H/2+14-S*(y0+y1)/2;
  const pj=p=>{const q=v.rot(p);return [ox+S*q[0],oy+S*q[1],q[2]];};
  const VW=v.view,list=[];const LT=nrm([-0.35,-0.55,0.75]);
  const dpath=q2=>'M'+q2.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';
  {const B=fit.B,pl=box(B[0]-14,B[1]-14,B[4]-11,B[2]+14,B[3]+14,B[4],{c:'mid',bias:-8e9});pl.plate=1;pl.deco=[{lines:[[[B[0]-9,B[1]-9,B[4]+.05],[B[2]+9,B[1]-9,B[4]+.05]],[[B[2]+9,B[1]-9,B[4]+.05],[B[2]+9,B[3]+9,B[4]+.05]],[[B[2]+9,B[3]+9,B[4]+.05],[B[0]-9,B[3]+9,B[4]+.05]],[[B[0]-9,B[3]+9,B[4]+.05],[B[0]-9,B[1]-9,B[4]+.05]]]}];items=[pl,...items];}
  for(const it of items){
    if(it.label||it.floor)continue;
    if(it.dot){const q=pj(it.dot);list.push({d:q[2]+it.bias,svg:'<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+Math.max(1,it.r*S*.8).toFixed(2)+'" style="fill:var(--anatomy-mid)"/>'});continue;}
    if(it.line){const a=pj(it.line[0]),b=pj(it.line[1]);list.push({d:(a[2]+b[2])/2+(it.bias||0),svg:KIT.lineSvg('M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+'L'+b[0].toFixed(1)+' '+b[1].toFixed(1),{tone:'mid'})});continue;}
    let cen=[0,0,0],cnt=0;for(const f of it.faces)for(const p of f.p){cen=add(cen,p);cnt++;}cen=mul(cen,1/cnt);
    const sh=['','','',''];let top='',crease='';const all2=[];
    it.faces.forEach(f=>{const p=f.p;let n=nrm(cross(sub(p[1],p[0]),sub(p[2],p[0])));if(Math.hypot(...n)<.5&&p.length>3)n=nrm(cross(sub(p[2],p[1]),sub(p[3],p[1])));
      let fc=[0,0,0];for(const q of p)fc=add(fc,q);fc=mul(fc,1/p.length);if(dot(n,sub(fc,cen))<0)n=mul(n,-1);
      const q2=p.map(pj);for(const q of q2)all2.push(q);
      if(dot(n,VW)<=1e-4)return;const d=dpath(q2);
      if(n[2]>.6){top+=d;if(!f.s&&!it.smooth)crease+=d;return;}
      const l=Math.max(0,dot(n,LT));sh[l>.55?3:l>.3?2:l>.1?1:0]+=d;if(!f.s&&!it.smooth)crease+=d;});
    let inner='';
    for(const dc of it.deco){for(const L of dc.lines){const a=pj(L[0]),b=pj(L[1]);inner+='M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+'L'+b[0].toFixed(1)+' '+b[1].toFixed(1);}}
    const h=hull(all2),hd=dpath(h);
    const lit=!!it.lit;
    let s=KIT.solidSvg({fill:hd,shades:sh,top,outline:it.hull?hd:'',crease,seamless:true},{lit,crease:'faint',tone:it.plate?'mid':it.hull?'hi':'faint',inner:inner?KIT.lineSvg(inner,{tone:it.plate?'faint':'lo'}):''});
    list.push({d:pj(cen)[2]+it.bias,svg:s});
  }
  list.sort((a,b)=>a.d-b.d);
  const phi=String(Math.floor(((window.__t||0)*55)%360)).padStart(3,'0');
  return list.map(x=>x.svg).join('')+'<text x="16" y="24" style="font:600 11px ui-monospace,monospace;letter-spacing:.08em;fill:#44443f">COOLING · AIR/WATER · '+phi+'°</text>';
}
function fitter(items,el,pad=14){let smin=1e9;const P=itemsPts(items.filter(i=>!i.floor));
  let B=[1e9,1e9,-1e9,-1e9,1e9];for(const p of P){B[0]=Math.min(B[0],p[0]);B[1]=Math.min(B[1],p[1]);B[2]=Math.max(B[2],p[0]);B[3]=Math.max(B[3],p[1]);B[4]=Math.min(B[4],p[2]);}
  const box=[];for(const x of [B[0]-14,B[2]+14])for(const y of [B[1]-14,B[3]+14])for(const z of [B[4]-11,Math.max(...P.map(p=>p[2]))])box.push([x,y,z]);
  for(let az=0;az<360;az+=10){const v=makeView(az,el);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of box){const q=v.rot(p);x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}smin=Math.min(smin,(W-2*pad)/(x1-x0),(H-2*pad-30)/(y1-y0));}
  return {scale:smin,P:box,B};}
